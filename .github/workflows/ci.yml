name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: shellcheck
        run: shellcheck --severity=style --format=gcc devps scripts/bump scripts/selftest

      - name: Parse check
        run: |
          bash -n devps
          bash -n scripts/bump
          bash -n scripts/selftest

      - name: Executable bit is committed
        run: |
          mode=$(git ls-files -s devps | awk '{print $1}')
          echo "mode=$mode"
          if [ "$mode" != "100755" ]; then
            echo "::error::devps must be committed executable (100755), found $mode"
            exit 1
          fi

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Self test
        run: ./scripts/selftest

  smoke-macos:
    name: smoke test (macOS)
    runs-on: macos-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2, which has no declare -A, mapfile or EPOCHREALTIME.
      # coreutils is only for gtimeout, which the dash fallback test wants.
      - name: Install bash 5 and coreutils
        run: |
          brew install bash coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Bash version in use
        run: |
          which -a bash
          bash --version | head -1

      - name: Self test
        run: ./scripts/selftest
